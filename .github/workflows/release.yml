name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # needed to create the GitHub Release

jobs:
  release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      # Uses the committed wrapper; setup-gradle also validates the wrapper jar checksum.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Check tag and signing secrets
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' must look like v1.2 or v1.2.3"
            exit 1
          fi
          missing=""
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (Settings > Secrets and variables > Actions)"
            exit 1
          fi
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Decode keystore
        run: echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/keystore.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build release APK
        run: ./gradlew assembleRelease -PappVersionName="${GITHUB_REF_NAME#v}" --stacktrace
        env:
          KEYSTORE_PATH: /tmp/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK
        run: |
          VERSION=${GITHUB_REF_NAME}
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/knowit-${VERSION}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: KnowIt ${{ github.ref_name }}
          body: |
            ## KnowIt ${{ github.ref_name }}

            ### Install
            1. Download `knowit-${{ github.ref_name }}.apk` below
            2. On your Android device: **Settings → Install unknown apps** → enable for your browser/file manager
            3. Open the downloaded APK and tap Install

            Already have KnowIt installed? This installs over it as an update and keeps your high score.

            ### Requirements
            Android 8.0 (API 26) or higher
          # Appends "What's Changed" (PRs merged since the previous tag) below the body.
          generate_release_notes: true
          files: app/build/outputs/apk/release/knowit-${{ github.ref_name }}.apk
