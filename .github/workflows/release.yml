name: Release APK

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode keystore
        run: echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/keystore.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build release APK
        run: gradle assembleRelease --stacktrace
        env:
          KEYSTORE_PATH: /tmp/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK
        run: |
          VERSION=${GITHUB_REF_NAME}
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/knowit-${VERSION}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: KnowIt ${{ github.ref_name }}
          body: |
            ## KnowIt ${{ github.ref_name }}

            ### Install
            1. Download `knowit-${{ github.ref_name }}.apk` below
            2. On your Android device: **Settings → Install unknown apps** → enable for your browser/file manager
            3. Open the downloaded APK and tap Install

            ### Requirements
            Android 8.0 (API 26) or higher
          files: app/build/outputs/apk/release/knowit-${{ github.ref_name }}.apk
